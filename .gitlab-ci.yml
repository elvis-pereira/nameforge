image: node:18-alpine

.releases:
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|beta|alpha)$/ && $CI_PIPELINE_SOURCE != 'schedule' && $CI_COMMIT_MESSAGE =~ /^(feat|fix).*/

workflow:
  rules:
    - if: $CI_COMMIT_MESSAGE =~ /^chore\(release\).*/ || $CI_COMMIT_TAG
      when: never
    - when: always

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .pnpm-store

before_script:
  - apk update --quiet
  - apk add --quiet curl git ack python3 build-base libxi-dev mesa-dev glew-dev pkgconfig
  - curl -LSs https://unpkg.com/@pnpm/self-installer | node
  - pnpm config set store-dir .pnpm-store
  - pnpm set verify-store-integrity false
  - pnpm install

stages:
  - test
  - build
  - release

variables:
  PACKAGE_REGISTRY_URL: $CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/module

biome:
  stage: test
  script:
    - pnpm biome ci --reporter=gitlab --reporter-file=code-quality.json
  artifacts:
    when: always
    reports:
      codequality: code-quality.json
  rules:
    - changes:
        paths:
        - src/**/*.js
        - scripts/**/*.js
        - module.json
        - lang/**/*.json
        - models/**/*.json

build:
  stage: build
  script:
    - export VERSION=$(pnpm --silent exec semantic-release --dry-run | ack -io '(?<=The next release version is )(.*)(?=$)') && echo VERSION=$VERSION >> build.env
    - export MANIFEST=$CI_PROJECT_URL/-/releases/permalink/latest/downloads/module.json && echo MANIFEST=$MANIFEST >> build.env
    - export DOWNLOAD=$CI_PROJECT_URL/-/releases/v$VERSION/downloads/module.zip && echo DOWNLOAD=$DOWNLOAD >> build.env
    - pnpm run build
    - pnpm run package
  artifacts:
    name: module
    when: on_success
    reports:
      dotenv: build.env
    paths:
      - module.zip
      - module.json
  extends: .releases

publish:
  stage: release
  script:
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file module.zip $PACKAGE_REGISTRY_URL/$VERSION/module.zip'
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file module.json $PACKAGE_REGISTRY_URL/$VERSION/module.json'
  dependencies:
    - build
  extends: .releases

release:
  stage: release
  script:
    - pnpm --silent exec semantic-release
  dependencies:
    - build
  extends: .releases
